<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1557b0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGrad)" filter="url(#shadow)"/>
  
  <!-- Scale of Justice -->
  <g fill="white" opacity="0.95">
    <!-- Base -->
    <rect x="90" y="140" width="20" height="30" rx="4"/>
    <rect x="70" y="165" width="60" height="10" rx="5"/>
    
    <!-- Central beam -->
    <rect x="50" y="88" width="100" height="8" rx="4"/>
    
    <!-- Left chain and pan -->
    <line x1="65" y1="92" x2="55" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 55 115 L 45 130 L 65 130 Z" fill="white" opacity="0.9"/>
    <ellipse cx="55" cy="130" rx="12" ry="4" fill="white" opacity="0.9"/>
    
    <!-- Right chain and pan -->
    <line x1="135" y1="92" x2="145" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 145 115 L 135 130 L 155 130 Z" fill="white" opacity="0.9"/>
    <ellipse cx="145" cy="130" rx="12" ry="4" fill="white" opacity="0.9"/>
    
    <!-- Center pivot -->
    <circle cx="100" cy="92" r="8" fill="white"/>
    <circle cx="100" cy="92" r="4" fill="#1557b0"/>
    
    <!-- Top pillar -->
    <rect x="95" y="60" width="10" height="32" rx="2" fill="white"/>
    
    <!-- Gavel crossed design -->
    <g transform="translate(100, 45)">
      <rect x="-20" y="-3" width="15" height="6" rx="2" transform="rotate(-45)" fill="white"/>
      <circle cx="-22" cy="0" r="6" fill="white"/>
      
      <rect x="5" y="-3" width="15" height="6" rx="2" transform="rotate(45)" fill="white"/>
      <circle cx="22" cy="0" r="6" fill="white"/>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="white" stroke-width="1" opacity="0.2"/>
</svg>

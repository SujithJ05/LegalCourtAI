<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1557b0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <g fill="white">
    <!-- Scale base -->
    <rect x="45" y="65" width="10" height="15" rx="2"/>
    <rect x="30" y="77" width="40" height="6" rx="3"/>
    
    <!-- Scale beam -->
    <rect x="25" y="48" width="50" height="4" rx="2"/>
    
    <!-- Left pan -->
    <path d="M 25 48 L 20 60 L 30 60 Z" opacity="0.9"/>
    <ellipse cx="25" cy="60" rx="8" ry="3" opacity="0.9"/>
    
    <!-- Right pan -->
    <path d="M 75 48 L 70 60 L 80 60 Z" opacity="0.9"/>
    <ellipse cx="75" cy="60" rx="8" ry="3" opacity="0.9"/>
    
    <!-- Center pivot -->
    <circle cx="50" cy="48" r="4"/>
    
    <!-- Top decoration -->
    <path d="M 40 25 L 50 15 L 60 25 L 55 30 L 50 27 L 45 30 Z" opacity="0.8"/>
  </g>
</svg>
